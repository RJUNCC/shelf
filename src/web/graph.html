<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent: #c678dd; color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #121216; color: #e8e6ea;
               font: 13px/1.4 "Roboto", "Noto Sans", system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.pointing { cursor: pointer; }
  #tip { position: absolute; pointer-events: none; max-width: 320px; background: #1c1c22; border: 1px solid #2c2c33;
         border-radius: 6px; padding: 6px 9px; display: none; box-shadow: 0 4px 16px #0008; }
  #card { position: absolute; right: 14px; top: 14px; width: 330px; max-height: calc(100% - 28px); overflow: auto;
          background: #18181d; border: 1px solid #2c2c33; border-radius: 8px; padding: 12px 14px; display: none;
          box-shadow: 0 8px 28px #000a; }
  #card h3 { margin: 0 0 2px; font-size: 15px; }
  #card .sub { color: #9a98a0; font-size: 12px; margin-bottom: 8px; }
  #card .quote { border-left: 3px solid var(--c, #f2c94c); padding: 2px 0 2px 9px; margin: 8px 0; }
  #card .note { color: #c9c7cd; margin: 6px 0; white-space: pre-wrap; }
  #card .item { padding: 6px 8px; border-radius: 5px; cursor: pointer; margin: 2px -8px; }
  #card .item:hover { background: #ffffff10; }
  #card .item small { color: #9a98a0; display: block; }
  #card button { background: var(--accent); color: #111; border: 0; border-radius: 4px; padding: 6px 12px;
                 font: inherit; font-weight: 600; cursor: pointer; margin-top: 6px; }
  #card .close { position: absolute; right: 8px; top: 6px; background: none; color: #9a98a0; font-size: 16px;
                 padding: 2px 6px; margin: 0; }
  .tag { display: inline-block; border: 1px solid #2c2c33; border-radius: 10px; padding: 1px 8px; margin: 2px 4px 2px 0;
         font-size: 12px; cursor: pointer; }
  .tag:hover { border-color: var(--accent); }
</style>
<script src="shelf://app/qwebchannel.js"></script>
<script defer src="shelf://app/graph.js"></script>
</head>
<body><canvas id="canvas"></canvas><div id="tip"></div><div id="card"></div></body>
</html>
