<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="shelf://app/vendor/katex/katex.min.css">
<link rel="stylesheet" href="shelf://app/rich/rich.css">
<link rel="stylesheet" href="shelf://app/rich/stage.css">
<script src="shelf://app/qwebchannel.js"></script>
<script src="shelf://app/vendor/marked/marked.min.js"></script>
<script src="shelf://app/vendor/katex/katex.min.js"></script>
<script src="shelf://app/vendor/katex/mhchem.min.js"></script>
<script src="shelf://app/vendor/mermaid/mermaid.min.js"></script>
<script src="shelf://app/tools/expr.js"></script>
<script src="shelf://app/rich/rich.js" defer></script>
<script src="shelf://app/rich/stage.js" defer></script>
</head>
<body>
<div id="lesson">
  <header><div class="title" id="title"></div><div class="dots" id="dots"></div><button class="close" id="close"></button></header>
  <main id="stage"></main>
  <div id="caption"></div>
  <footer>
    <button class="icon" id="prev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="icon play" id="play"></button>
    <button class="icon" id="next"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="icon" id="replay"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <div class="menu-wrap"><button class="menu-button" id="board"></button><div class="menu" id="boardMenu"></div></div>
    <span class="speed"><input type="range" id="speed" min="0.5" max="2" step="0.05" value="1"><span id="speedLabel">1×</span></span>
    <button class="icon on" id="cc"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/></svg></button>
    <span class="volume" id="volumeRow"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><input type="range" id="volume" min="0" max="100" value="100"></span>
    <span class="status" id="status"></span>
    <div class="ask"><input id="askField" type="text"></div>
  </footer>
</div>
</body>
</html>
